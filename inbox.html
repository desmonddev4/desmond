<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a1030">
<title>Inbox | Desmond Amedzie</title>
<link rel="icon" href="assets/logo-mark.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/chat.css">
</head>
<body class="ib-body">
<i class="ib-bl" style="width:520px;height:520px;left:-140px;top:-120px;background:#6a2cff"></i>
<i class="ib-bl" style="width:560px;height:440px;right:-120px;top:10%;background:#1f6bff"></i>
<i class="ib-bl" style="width:380px;height:380px;left:38%;bottom:-160px;background:#25c8ff"></i>

<div class="ib" id="app" data-v="list" hidden>
  <div class="ibw">

    <!-- left: conversations (same glass language as the visitor chat's welcome pane) -->
    <aside class="ib-side" aria-label="Conversations">
      <header class="ib-head">
        <span class="av orbm" aria-hidden="true"></span>
        <div class="txt"><h1>Inbox</h1><p id="sum">No conversations yet</p></div>
        <button class="ic-btn" id="notif" type="button" aria-label="Turn on desktop alerts" title="Turn on desktop alerts" hidden></button>
        <button class="ic-btn" id="menuBtn" type="button" aria-label="More options" aria-haspopup="menu" aria-expanded="false"></button>
      </header>
      <div class="nc-menu ib-menu" id="menu" role="menu" hidden>
        <a role="menuitem" href="admin/index.html">Admin dashboard</a>
        <a role="menuitem" href="index.html" target="_blank" rel="noopener">View my site</a>
        <button role="menuitem" id="out" type="button">Sign out</button>
      </div>

      <label class="ib-av" id="avbox" data-state="online"><i class="dot"></i><span class="lbl">Show me as available</span><input class="sw tg" id="avail" type="checkbox" role="switch" checked></label>

      <label class="nc-name ib-search"><span>Search conversations</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search name, email or message" autocomplete="off" aria-label="Search conversations" enterkeyhint="search"></label>
      <div class="nc-chips ib-f" id="filters" role="tablist" aria-label="Filter conversations"></div>

      <div class="ib-list" id="list"></div>
    </aside>

    <!-- right: the thread, identical to the popup the visitor sees -->
    <section class="ib-thread" id="thread">
      <div class="ib-none" id="none">
        <div class="orbx" aria-hidden="true"><b><s></s><s></s></b><i></i></div>
        <p class="hi">Hello, <span>Desmond</span></p>
        <h3>Pick a conversation</h3>
        <p class="sub">New messages appear on the left the moment someone says hello.</p>
      </div>
      <div id="tbox" hidden style="display:none;flex-direction:column;flex:1;min-height:0">
        <header class="nc-bar">
          <button class="ic-btn nc-back" id="back" aria-label="Back to conversations" type="button"></button>
          <div class="nc-who"><span class="av" id="tav"></span><span class="nc-ttl"><b id="tname"></b><span class="nc-sub" id="tsub" data-state="away"><i class="dot"></i><span id="tstat">Visitor</span></span></span></div>
          <div class="ib-tags" id="ttags"></div>
          <button class="ic-btn" id="delc" aria-label="Delete conversation" title="Delete conversation" type="button"></button>
        </header>
        <div class="nc-feedwrap" id="feed"></div>
        <footer class="nc-comp">
          <div class="nc-card">
            <div class="nc-chips" id="canned" hidden></div>
            <div class="nc-box">
              <textarea id="ta" rows="1" maxlength="2000" placeholder="Reply…" aria-label="Your reply" enterkeyhint="send"></textarea>
              <div class="nc-tools"><button class="ic-btn sm" id="cbtn" aria-label="Canned replies" aria-expanded="false" type="button"></button><span class="cnt" aria-live="polite"></span><button class="send" id="send" type="button" aria-label="Send reply" disabled></button></div>
            </div>
          </div>
        </footer>
      </div>
    </section>

  </div>
</div>
<script src="js/firebase-config.js"></script>
<script src="js/chat-config.js"></script>
<script src="js/chat-core.js"></script>
<script src="js/chat-ui.js"></script>
<script src="js/inbox.js"></script>
</body>
</html>
